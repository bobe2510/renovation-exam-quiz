<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNS 圖例練習</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1f2933;--sub:#616e7c;--bd:#d9e2ec;--pri:#1f4e79;--pri-tx:#fff;--ok:#0a7f2e;--ok-bg:#e6f6ea;--no:#b42318;--no-bg:#fdecea;--warn:#b45309;--warn-bg:#fff4e0;--sel:#e3eefb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--pri-tx)}
.hd{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hd h1{font-size:1.1em;margin:0 12px 0 0}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:transparent;color:inherit;border:1px solid transparent;padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{border-color:currentColor;font-weight:700}

main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:0 0 14px}
h2{font-size:1.15em;margin:0 0 8px}
.sub{color:var(--sub);font-size:.9em}
button.b{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
button.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--bd);border-radius:999px;padding:2px 10px;cursor:pointer;background:var(--card);color:var(--tx);font:inherit;font-size:.9em}
.chip.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
input[type=search]{flex:1;min-width:160px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sym{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--card);display:flex;flex-direction:column;gap:2px}
/* drawings always on paper: black ink on white, so 「塗黑」 stays black in dark mode */
.sym .pic,.q-pic,.cmp .pic{background:#fff;border-radius:6px;padding:4px;border:1px solid var(--bd)}
svg.cns{display:block;width:100%;height:auto;color:#111;overflow:visible}
svg.cns .hole{fill:#fff}
.opt svg.cns{background:#fff;border-radius:6px}
.sym b{font-size:1em}
.sym .tip{font-size:.85em;color:var(--sub)}
.refs{font-size:.8em;color:var(--sub)}
.refs .r{display:inline-block;border:1px solid var(--bd);border-radius:4px;padding:0 4px;margin:2px 3px 0 0}
.orig{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.orig img{max-height:44px;max-width:120px;background:#fff;border:1px solid var(--bd);border-radius:4px;padding:2px}
.catttl{margin:18px 0 8px;font-size:1.05em;border-bottom:2px solid var(--pri);padding-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:.95em}
td,th{border:1px solid var(--bd);padding:4px 8px;text-align:left}
th{background:var(--bg)}
td.k{font-family:'Times New Roman',serif;font-weight:700;white-space:nowrap;width:30%}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.cmp div{text-align:center;font-size:.85em}
.q-pic{max-width:340px;margin:8px auto;padding:10px}
.q-txt{font-size:1.25em;font-weight:700;text-align:center;margin:10px 0}
.opts{display:grid;gap:8px;margin-top:10px}
.opts.pics{grid-template-columns:repeat(2,1fr)}
.opt{border:2px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--tx);cursor:pointer;text-align:left;font:inherit;display:flex;gap:8px;align-items:center}
.opt .n{font-weight:700;color:var(--sub)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.no{border-color:var(--no);background:var(--no-bg)}
.opt svg.cns{max-width:160px}
.fb{margin-top:12px}
.banner{padding:8px 12px;border-radius:8px;font-weight:700}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.no{background:var(--no-bg);color:var(--no)}
.explain svg.cns{max-height:110px}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--pri)}
label{cursor:pointer}
.note{background:var(--warn-bg);color:var(--tx);border-left:4px solid var(--warn);padding:6px 10px;border-radius:6px;font-size:.9em}
@media (max-width:560px){.opts.pics{grid-template-columns:1fr 1fr}.hd h1{width:100%}}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('dataset').textContent);
const SY = Object.fromEntries(D.syms.map(s => [s.id, s]));
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NUM = ['①','②','③','④'];
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };
const pic = id => `<div class="pic">${D.svg[id]}</div>`;
const refChips = s => s.r.length ? `<div class="refs">題庫：${s.r.map(([k]) => `<span class="r">01-${k}</span>`).join('')}</div>` : '';
const card = (s, orig) => `<div class="sym">${pic(s.id)}<b>${esc(s.n)}</b><div class="tip">${esc(s.t)}</div>${refChips(s)}${orig && s.r.some(r => r[1] >= 0) ? `<div class="orig">${s.r.filter(r => r[1] >= 0).map(r => `<img src="${D.img[r[1]]}" alt="題庫原圖 01-${r[0]}" title="題庫原圖 01-${r[0]}">`).join('')}</div>` : ''}</div>`;

let theme = store.get('cnsTheme', null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById('theme').onclick = () => {
  const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  theme = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = theme; store.set('cnsTheme', theme);
};

// ---------------- 圖例說明 ----------------
const G = { cat: -1, q: '', bank: false, orig: true };
function guide(){
  app.innerHTML = `<div class="card"><div class="note">圖例依 CNS 11567（A1042）103 年版表 5、8、9、13～17 重新繪製。「題庫：01-S8」表示學科圖說判讀第 S8 題考過；勾選「題庫原圖」可對照考卷上的實際圖形。</div>
    <div class="chips" id="cats"></div>
    <div class="row"><input type="search" id="q" placeholder="搜尋名稱或特徵，例如：插座、圓內 S、FHC" value="${esc(G.q)}">
    <label><input type="checkbox" id="bank" ${G.bank ? 'checked' : ''}> 只看題庫考過</label>
    <label><input type="checkbox" id="orig" ${G.orig ? 'checked' : ''}> 題庫原圖</label></div></div><div id="list"></div>`;
  const cats = app.querySelector('#cats');
  cats.innerHTML = [`<button class="chip ${G.cat < 0 ? 'on' : ''}" data-c="-1">全部</button>`, ...D.cats.map((c, i) => `<button class="chip ${G.cat === i ? 'on' : ''}" data-c="${i}">${esc(c)}</button>`)].join('');
  cats.onclick = e => { if (e.target.dataset.c !== undefined) { G.cat = +e.target.dataset.c; guide() } };
  app.querySelector('#q').oninput = e => { G.q = e.target.value; list() };
  app.querySelector('#bank').onchange = e => { G.bank = e.target.checked; list() };
  app.querySelector('#orig').onchange = e => { G.orig = e.target.checked; list() };
  list();
}
function list(){
  const kw = G.q.trim().toLowerCase();
  let html = '';
  D.cats.forEach((c, ci) => {
    if (G.cat >= 0 && G.cat !== ci) return;
    const items = D.syms.filter(s => s.c === ci && (!G.bank || s.r.length) && (!kw || (s.n + s.t + c).toLowerCase().includes(kw)));
    if (!items.length) return;
    html += `<h2 class="catttl">${esc(c)}（${items.length}）</h2><div class="grid">${items.map(s => card(s, G.orig)).join('')}</div>`;
  });
  app.querySelector('#list').innerHTML = html || '<div class="card sub">沒有符合的圖例。</div>';
}

// ---------------- 易混淆 ----------------
function confuse(){
  app.innerHTML = D.confuse.map(([t, ids, tip]) => `<div class="card"><h2>${esc(t)}</h2><div class="sub">${esc(tip)}</div>
    <div class="cmp">${ids.map(id => `<div>${pic(id)}${esc(SY[id].n)}</div>`).join('')}</div></div>`).join('');
}

// ---------------- 文字代號 ----------------
function codes(){
  app.innerHTML = D.codeCats.map((c, ci) => `<div class="card"><h2>${esc(c)}</h2><table><tr><th>代號</th><th>意義</th></tr>${
    D.codes.filter(x => x.c === ci).map(x => `<tr><td class="k">${esc(x.k)}</td><td>${esc(x.n)}</td></tr>`).join('')}</table></div>`).join('')
    + `<div class="card sub">出處：CNS 11567 第 10 節（圖號）、表 7（常用符號）、表 11（結構圖基本符號）、表 3（比例尺）。</div>`;
}

// ---------------- 測驗 ----------------
const QS = store.get('cnsQuizSet', { mode: 'mix', cats: D.cats.map((_, i) => i), codeCats: D.codeCats.map((_, i) => i), bank: false, n: 20 });
let S = null;
const sameLook = (a, b) => D.svg[a].replace(/<title>.*?<\/title>|aria-label="[^"]*"/g, '') === D.svg[b].replace(/<title>.*?<\/title>|aria-label="[^"]*"/g, '');
const baseName = n => n.replace(/（.*?）/g, '');
function distract(id, n = 3){
  const out = [], ok = c => c !== id && !out.includes(c) && !sameLook(c, id) && baseName(SY[c].n) !== baseName(SY[id].n) && !out.some(o => sameLook(o, c));
  for (const g of shuffle(D.groups.filter(g => g.includes(id)))) for (const c of shuffle(g)) if (out.length < n && ok(c)) out.push(c);
  for (const c of shuffle(D.syms.filter(s => s.c === SY[id].c).map(s => s.id))) if (out.length < n && ok(c)) out.push(c);
  for (const c of shuffle(D.syms.map(s => s.id))) if (out.length < n && ok(c)) out.push(c);
  return out;
}
function makeSym(id, kind){
  const opts = shuffle([id, ...distract(id)]);
  return { kind, id, opts, ans: opts.indexOf(id) };
}
function makeCode(i){
  const x = D.codes[i], pool = shuffle(D.codes.filter((y, j) => j !== i && y.c === x.c));
  const uniq = (key) => { const seen = new Set([x[key]]); return pool.filter(y => !seen.has(y[key]) && seen.add(y[key])) };
  const uniqueCode = !pool.some(y => y.k === x.k), uniqueName = !pool.some(y => y.n === x.n);
  if (uniqueCode && (Math.random() < .5 || !uniqueName)) {        // 代號 → 意義
    const opts = shuffle([x, ...uniq('n').filter(y => y.k !== x.k).slice(0, 3)]);
    return { kind: 'c2n', x, opts: opts.map(o => o.n), ans: opts.indexOf(x) };
  }
  const opts = shuffle([x, ...uniq('k').filter(y => y.n !== x.n).slice(0, 3)]);
  return { kind: 'n2c', x, opts: opts.map(o => o.k), ans: opts.indexOf(x) };
}
function quizSetup(){
  const catBox = (arr, key) => arr.map((c, i) => `<label class="chip ${QS[key].includes(i) ? 'on' : ''}"><input type="checkbox" data-k="${key}" value="${i}" ${QS[key].includes(i) ? 'checked' : ''} hidden>${esc(c)}</label>`).join('');
  const wrong = store.get('cnsWrong', {});
  app.innerHTML = `<div class="card"><h2>測驗設定</h2>
    <div class="row"><b>題型</b>${[['img2name', '看圖選名稱'], ['name2img', '看名稱選圖'], ['code', '文字代號'], ['mix', '混合']].map(([v, t]) => `<label><input type="radio" name="mode" value="${v}" ${QS.mode === v ? 'checked' : ''}> ${t}</label>`).join('')}</div>
    <div style="margin-top:8px"><b>圖例範圍</b><div class="chips">${catBox(D.cats, 'cats')}</div></div>
    <div><b>文字代號範圍</b><div class="chips">${catBox(D.codeCats, 'codeCats')}</div></div>
    <div class="row"><label><input type="checkbox" id="bank" ${QS.bank ? 'checked' : ''}> 圖例只考題庫考過的（${D.syms.filter(s => s.r.length).length} 個）</label>
    <label>題數 <select id="n">${[10, 20, 40, 0].map(v => `<option value="${v}" ${QS.n === v ? 'selected' : ''}>${v || '全部'}</option>`).join('')}</select></label></div>
    <div class="row" style="margin-top:10px"><button class="b pri" id="go">開始測驗</button><button class="b" id="gw" ${Object.keys(wrong).length ? '' : 'disabled'}>只練錯題（${Object.keys(wrong).length}）</button></div></div>`;
  app.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { QS.mode = r.value; store.set('cnsQuizSet', QS) });
  app.querySelectorAll('input[data-k]').forEach(c => c.onchange = () => {
    const a = QS[c.dataset.k], v = +c.value; c.checked ? a.push(v) : a.splice(a.indexOf(v), 1);
    c.parentElement.classList.toggle('on', c.checked); store.set('cnsQuizSet', QS);
  });
  app.querySelector('#bank').onchange = e => { QS.bank = e.target.checked; store.set('cnsQuizSet', QS) };
  app.querySelector('#n').onchange = e => { QS.n = +e.target.value; store.set('cnsQuizSet', QS) };
  app.querySelector('#go').onclick = () => start();
  app.querySelector('#gw').onclick = () => start(true);
}
function start(onlyWrong){
  let items = [];
  const wrong = store.get('cnsWrong', {});
  const symPool = D.syms.filter(s => QS.cats.includes(s.c) && (!QS.bank || s.r.length)).map(s => s.id);
  const codePool = D.codes.map((x, i) => i).filter(i => QS.codeCats.includes(D.codes[i].c));
  if (onlyWrong) {
    for (const key of Object.keys(wrong)) {
      const [t, v] = key.split(':');
      if (t === 's' && SY[v]) items.push(makeSym(v, Math.random() < .5 ? 'img2name' : 'name2img'));
      if (t === 'c' && D.codes[+v]) items.push(makeCode(+v));
    }
  } else {
    if (QS.mode === 'img2name' || QS.mode === 'name2img') items = symPool.map(id => makeSym(id, QS.mode));
    else if (QS.mode === 'code') items = codePool.map(makeCode);
    else items = [...symPool.map(id => makeSym(id, Math.random() < .5 ? 'img2name' : 'name2img')), ...shuffle(codePool).slice(0, Math.ceil(symPool.length / 4)).map(makeCode)];
  }
  items = shuffle(items);
  if (!onlyWrong && QS.n) items = items.slice(0, QS.n);
  if (!items.length) { app.innerHTML = '<div class="card">範圍內沒有題目，請回到設定調整。</div>'; return }
  S = { items, i: 0, right: 0, wrongList: [] };
  ask();
}
function qKey(it){ return it.kind === 'c2n' || it.kind === 'n2c' ? 'c:' + D.codes.indexOf(it.x) : 's:' + it.id }
function ask(){
  const it = S.items[S.i];
  let stem, opts, pics = false;
  if (it.kind === 'img2name') { stem = `<div class="q-txt">這個圖例是？</div><div class="q-pic">${D.svg[it.id]}</div>`; opts = it.opts.map(o => esc(SY[o].n)) }
  else if (it.kind === 'name2img') { stem = `<div class="q-txt">哪一個是「${esc(SY[it.id].n)}」？</div>`; opts = it.opts.map(o => D.svg[o]); pics = true }
  else if (it.kind === 'c2n') { stem = `<div class="sub" style="text-align:center">${esc(D.codeCats[it.x.c])}</div><div class="q-txt" style="font-family:'Times New Roman',serif;font-size:2em">${esc(it.x.k)}</div><div class="q-txt">代表什麼？</div>`; opts = it.opts.map(esc) }
  else { stem = `<div class="sub" style="text-align:center">${esc(D.codeCats[it.x.c])}</div><div class="q-txt">「${esc(it.x.n)}」的代號是？</div>`; opts = it.opts.map(o => `<span style="font-family:'Times New Roman',serif;font-size:1.2em">${esc(o)}</span>`) }
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><span class="sub">第 ${S.i + 1} / ${S.items.length} 題　答對 ${S.right}</span><button class="b" id="quit">結束</button></div>
    <div class="prog"><i style="width:${S.i / S.items.length * 100}%"></i></div>${stem}
    <div class="opts ${pics ? 'pics' : ''}">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="n">${NUM[i]}</span>${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="b pri" id="next" disabled>下一題 →</button></div></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  app.querySelector('#next').onclick = next;
  app.querySelector('#quit').onclick = finish;
}
function answer(i){
  const it = S.items[S.i];
  if (it.done) return; it.done = true;
  const ok = i === it.ans, wrong = store.get('cnsWrong', {}), key = qKey(it);
  if (ok) { S.right++; if (wrong[key]) { wrong[key]--; if (wrong[key] <= 0) delete wrong[key] } }
  else { wrong[key] = (wrong[key] || 0) + 1; S.wrongList.push(it) }
  store.set('cnsWrong', wrong);
  app.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (j === it.ans) b.classList.add('ok'); else if (j === i) b.classList.add('no') });
  let ex = '';
  if (it.id) {
    const right = SY[it.id], chosen = SY[it.opts[i]];
    ex = `<div class="explain">${card(right, true)}${!ok ? card(chosen, false).replace('<div class="sym">', '<div class="sym" style="border-color:var(--no)"><span class="sub">你選的是</span>') : ''}</div>`;
  } else {
    const chosen = it.kind === 'c2n' ? D.codes.find(y => y.c === it.x.c && y.n === it.opts[i]) : D.codes.find(y => y.c === it.x.c && y.k === it.opts[i]);
    ex = `<div class="card" style="margin:8px 0 0"><b style="font-family:'Times New Roman',serif">${esc(it.x.k)}</b>＝${esc(it.x.n)}${!ok && chosen ? `<div class="sub">你選的 ${esc(chosen.k)}＝${esc(chosen.n)}</div>` : ''}</div>`;
  }
  app.querySelector('#fb').innerHTML = `<div class="banner ${ok ? 'ok' : 'no'}">${ok ? '答對了！' : '答錯了'}　正確答案：${NUM[it.ans]}</div>${ex}`;
  const n = app.querySelector('#next'); n.disabled = false; n.textContent = S.i + 1 < S.items.length ? '下一題 →' : '看結果'; n.focus({ preventScroll: true });
}
function next(){ if (S.i + 1 < S.items.length) { S.i++; ask() } else finish() }
function finish(){
  const done = S.items.filter(x => x.done).length;
  app.innerHTML = `<div class="card"><h2>結果：${S.right} / ${done}</h2>
    ${S.wrongList.length ? `<div class="sub">這次答錯的（已記入錯題本，之後答對會自動移除）：</div><div class="grid" style="margin-top:8px">${S.wrongList.map(it => it.id ? card(SY[it.id], false) : `<div class="sym"><b style="font-family:'Times New Roman',serif;font-size:1.3em">${esc(it.x.k)}</b><div>${esc(it.x.n)}</div><div class="tip">${esc(D.codeCats[it.x.c])}</div></div>`).join('')}</div>` : '<div>全對！</div>'}
    <div class="row" style="margin-top:12px"><button class="b pri" id="again">再測一次</button><button class="b" id="setup">回到設定</button></div></div>`;
  app.querySelector('#again').onclick = () => start();
  app.querySelector('#setup').onclick = quizSetup;
}
document.addEventListener('keydown', e => {
  if (!S || !app.querySelector('.opts')) return;
  if (/^[1-4]$/.test(e.key)) { const b = app.querySelector(`.opt[data-i="${+e.key - 1}"]`); if (b && !b.disabled) b.click() }
  else if (e.key === 'Enter') { const n = app.querySelector('#next'); if (n && !n.disabled) { e.preventDefault(); n.click() } }
});

// ---------------- 錯題本 ----------------
function wrongBook(){
  const w = store.get('cnsWrong', {}), keys = Object.keys(w).sort((a, b) => w[b] - w[a]);
  app.innerHTML = `<div class="card"><h2>錯題本（${keys.length}）</h2><div class="sub">答錯 +1、答對 −1，歸零自動移除。只存在這台裝置的瀏覽器裡。iPhone 請用 Safari 打開，按「分享 → 加入主畫面」，之後從主畫面圖示開啟；直接用 Safari 開的網頁若 7 天沒打開，Safari 可能自動清掉進度。</div>
    <div class="row" style="margin-top:8px"><button class="b pri" id="gw" ${keys.length ? '' : 'disabled'}>練錯題</button><button class="b" id="clr" ${keys.length ? '' : 'disabled'}>清空</button></div></div>
    <div class="grid">${keys.map(k => { const [t, v] = k.split(':'); if (t === 's' && SY[v]) return card(SY[v], true).replace('<b>', `<span class="sub">錯 ${w[k]} 次</span><b>`);
      const x = D.codes[+v]; return x ? `<div class="sym"><span class="sub">錯 ${w[k]} 次</span><b style="font-family:'Times New Roman',serif;font-size:1.3em">${esc(x.k)}</b><div>${esc(x.n)}</div><div class="tip">${esc(D.codeCats[x.c])}</div></div>` : '' }).join('')}</div>`;
  app.querySelector('#gw').onclick = () => { show('quiz', true) };
  app.querySelector('#clr').onclick = () => { store.set('cnsWrong', {}); wrongBook() };
}

const views = { guide, confuse, codes, quiz: quizSetup, wrong: wrongBook };
function show(v, wrongOnly){
  S = null;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  store.set('cnsView', v);
  if (wrongOnly) { quizSetup(); start(true) } else views[v]();
  scrollTo(0, 0);
}
document.getElementById('nav').onclick = e => { if (e.target.dataset.v) show(e.target.dataset.v) };
show(store.get('cnsView', 'guide'));
</script>
</body>
</html>
